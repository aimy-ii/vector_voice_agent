[project]
name = "vector_voice_agent"
version = "0.1.0"
description = "Агентский сервис голосового бота автошколы «Вектор» (LangGraph Server)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "socksio>=1.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.2",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "utils", "kb", "script", "graph"]

[tool.setuptools.package-dir]
"core" = "src/core"
"utils" = "src/utils"
"kb" = "src/kb"
"script" = "src/script"
"graph" = "src/graph"

[tool.setuptools.package-data]
"script" = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "D", "D401", "T201", "UP"]
lint.ignore = ["UP006", "UP007", "UP035", "D417", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "D100"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.14",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.2",
    "mypy>=1.13.0",
]
