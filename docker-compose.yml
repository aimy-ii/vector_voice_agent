volumes:
  vector-agent-data:
    driver: local

services:
  vector-agent-redis:
    image: redis:6
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 1s
      retries: 5

  vector-agent-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - vector-agent-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      start_period: 10s
      timeout: 1s
      retries: 5
      interval: 5s

  vector-agent-api:
    image: vector_voice_agent
    ports:
      # Единственный порт наружу. Внутри образа сервер слушает 8000,
      # на хосте занимаем 8127: 8000, 8123, 8137 и 8317 уже заняты.
      - "8127:8000"
    depends_on:
      vector-agent-redis:
        condition: service_healthy
      vector-agent-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URI: redis://vector-agent-redis:6379
      DATABASE_URI: postgres://postgres:postgres@vector-agent-postgres:5432/postgres?sslmode=disable
    extra_hosts:
      # Нужен только при запуске этого compose отдельно от vector-infra:
      # справочник тогда на порту хоста. В общем стеке VECTOR_KB_URL указывает
      # на сервис vector-kb в сети vector, и extra_hosts не используется.
      - "host.docker.internal:host-gateway"
    healthcheck:
      # В образе langgraph build нет curl — тот же приём, что в vector-infra.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ok')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
